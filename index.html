<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grow Or Escape</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#050712;color:white;font-family:Arial,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
canvas{display:block;background:radial-gradient(circle at center,#13204a 0%,#050712 75%)}
#ui{
  position:fixed;top:12px;left:12px;z-index:10;
  font-size:14px;line-height:1.45;text-shadow:0 0 10px #00eaff;
  pointer-events:none;
}
#center{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(0,0,0,.48);z-index:30;text-align:center;padding:22px;
}
h1{margin:0 0 10px;font-size:42px;text-shadow:0 0 24px #00eaff}
p{font-size:17px;opacity:.9;max-width:340px}
.gameBtn{
  margin-top:16px;padding:16px 32px;border:0;border-radius:999px;
  background:#00eaff;color:#05111d;font-size:18px;font-weight:bold;
  box-shadow:0 0 24px #00eaff;touch-action:manipulation;
  position:relative;z-index:9999;-webkit-tap-highlight-color:transparent;
}
#hint{
  position:fixed;bottom:176px;width:100%;text-align:center;
  font-size:12px;opacity:.68;z-index:12;pointer-events:none;
}
#pad{
  position:fixed;left:0;right:0;bottom:0;height:165px;z-index:11;
  background:linear-gradient(180deg,rgba(0,234,255,.02),rgba(0,234,255,.14));
  border-top:2px solid rgba(0,234,255,.35);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.8);font-size:12px;text-shadow:0 0 8px #00eaff;
}
#joyBase{
  position:absolute;width:86px;height:86px;border-radius:50%;
  border:2px solid rgba(0,234,255,.42);box-shadow:0 0 18px rgba(0,234,255,.25);
  left:50%;top:42%;transform:translate(-50%,-50%);
}
#joyKnob{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:rgba(0,234,255,.8);box-shadow:0 0 18px #00eaff;
  left:50%;top:42%;transform:translate(-50%,-50%);
}
#padText{position:absolute;bottom:18px}
@media (min-width:900px){
  #pad{height:120px}
  #hint{bottom:130px}
  #ui{font-size:18px}
}
</style>
</head>
<body>
<div id="ui">
Multiplier: <span id="mult">x1.00</span><br>
Status: <span id="status">Grow</span>
</div>

<div id="hint">Use joystick • Eat blue dots • Avoid red bombs • Escape yellow portal</div>

<div id="pad">
  <div id="joyBase"></div>
  <div id="joyKnob"></div>
  <div id="padText">JOYSTICK AREA</div>
</div>

<div id="center">
  <h1>GROW OR ESCAPE</h1>
  <p>Grow fast. Escape alive.</p>
  <button class="gameBtn" id="startBtn">START ROUND</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const multEl=document.getElementById('mult'),statusEl=document.getElementById('status');
const center=document.getElementById('center'),pad=document.getElementById('pad');
const joyKnob=document.getElementById('joyKnob');

let W,H,CONTROL_H;
let player,dots,bombs,bots,portal,startTime,roundLength,running=false;
let joy={x:0,y:0,active:false};
let pointer={x:0,y:0,active:false};
let audioCtx=null,ambientOsc=null,ambientGain=null,heartOsc=null,heartGain=null;

function mobile(){return innerWidth<900}
function resize(){
  W=canvas.width=innerWidth; H=canvas.height=innerHeight;
  CONTROL_H=mobile()?165:120;
  pointer.x=W/2; pointer.y=H/2;
}
resize(); addEventListener('resize',resize);

function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  ambientOsc=audioCtx.createOscillator();
  ambientGain=audioCtx.createGain();
  ambientOsc.type='sine';
  ambientOsc.frequency.value=42;
  ambientGain.gain.value=0.004;
  ambientOsc.connect(ambientGain); ambientGain.connect(audioCtx.destination); ambientOsc.start();

  heartOsc=audioCtx.createOscillator();
  heartGain=audioCtx.createGain();
  heartOsc.type='sine';
  heartOsc.frequency.value=48;
  heartGain.gain.value=0;
  heartOsc.connect(heartGain); heartGain.connect(audioCtx.destination); heartOsc.start();
}
function updateAudio(now){
  if(!audioCtx||!player) return;

  const elapsed = now - startTime;
  const timePressure = Math.min(elapsed / roundLength, 1);
  const multiplierPressure = Math.min(player.m / 10, 1);
  const intensity = Math.min(1, timePressure * 0.65 + multiplierPressure * 0.55);

  // Smooth rising casino tension tone
  ambientGain.gain.value = 0.004 + intensity * 0.026;
  ambientOsc.frequency.value = 34 + intensity * 55 + player.m * 1.5;

  // Heartbeat becomes faster and louder as time runs out / multiplier grows
  const beatSpeed = 0.0028 + intensity * 0.010;
  const beat = Math.max(0, Math.sin(now * beatSpeed));
  const pulse = Math.pow(beat, 2.4);

  heartGain.gain.value = pulse * (0.018 + intensity * 0.12);
  heartOsc.frequency.value = 40 + intensity * 18;

  // Full screen pulse synced with heartbeat
  const scale = 1 + pulse * (0.006 + intensity * 0.032);
  const brightness = 1 + pulse * (0.025 + intensity * 0.10);
  document.body.style.transform = `scale(${scale})`;
  document.body.style.filter = `brightness(${brightness})`;
}

function makeDot(){
  const v=[.05,.07,.10,.14,.20][Math.floor(Math.random()*5)];
  const s=mobile()?0.68:1;
  return {x:rand(22,W-22),y:rand(42,H-CONTROL_H-32),r:(7+v*18)*s,v,p:rand(0,6.28)}
}
function makeBomb(){
  const s=mobile()?0.68:1;
  const base=rand(10,15)*s;
  return {x:rand(35,W-35),y:rand(50,H-CONTROL_H-42),baseR:base,r:base,p:rand(0,6.28)}
}
function makeBot(i){
  const colors=['#ff9f1c','#b45cff','#39ff88','#ff4fd8','#ffe600','#42a5ff'];
  const names=['VIP','FAST','LUKA','NIKA','HUNTER','GEO'];
  return {x:rand(50,W-50),y:rand(60,H-CONTROL_H-60),r:rand(11,16)*(mobile()?0.74:1),m:rand(1,1.45),speed:rand(.65,1.1)*(mobile()?0.78:1),color:colors[i%6],name:names[i%6]}
}
function bombRadius(b){
  const shrink=Math.min((player.r-16)*0.012,.45);
  return Math.max(b.baseR*(1-shrink),mobile()?4.5:7)
}
function glow(x,y,r,c,g=22){
  ctx.save();ctx.shadowBlur=g;ctx.shadowColor=c;ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}

function showStart(title='GROW OR ESCAPE', msg='Grow fast. Escape alive.', btn='START ROUND'){
  center.innerHTML=`<h1>${title}</h1><p>${msg}</p><button class="gameBtn" id="startBtn">${btn}</button>`;
  center.style.display='flex';
  const b=document.getElementById('startBtn');
  b.addEventListener('click', startGame);
  b.addEventListener('touchend', e=>{e.preventDefault();startGame()}, {passive:false});
}
function startGame(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();

  const baseR=mobile()?12:16;
  player={x:W/2,y:H/2,r:baseR,m:1,vx:0,vy:0,baseR};
  joy={x:0,y:0,active:false}; resetKnob();
  dots=Array.from({length:mobile()?32:40},makeDot);
  bombs=Array.from({length:mobile()?6:8},makeBomb);
  bots=Array.from({length:mobile()?5:7},(_,i)=>makeBot(i));
  portal={x:rand(80,W-80),y:rand(80,H-CONTROL_H-80),r:mobile()?30:36,active:false,lastMove:0};
  startTime=performance.now(); roundLength=rand(12000,18000);
  window.lastBombSpawn=0; running=true; document.body.style.transform='scale(1)'; document.body.style.filter='brightness(1)'; center.style.display='none'; statusEl.textContent='Grow';
  requestAnimationFrame(loop);
}
showStart();

function endGame(title,msg){
  running=false; document.body.style.transform='scale(1)'; document.body.style.filter='brightness(1)'; resetKnob();
  showStart(title, msg+`<br>Final: x${player.m.toFixed(2)}`, 'PLAY AGAIN');
}
function updateBots(){
  bots.forEach(bot=>{
    let target=dots[0],best=99999;
    dots.forEach(d=>{let dd=dist(bot,d);if(dd<best){best=dd;target=d}});
    let tx=target.x,ty=target.y,pd=dist(bot,player);
    if(bot.r>player.r*1.14&&pd<170){tx=player.x;ty=player.y}
    else if(bot.r<player.r*.92&&pd<150){tx=bot.x+(bot.x-player.x);ty=bot.y+(bot.y-player.y)}
    const dx=tx-bot.x,dy=ty-bot.y,len=Math.hypot(dx,dy)||1;
    bot.x+=(dx/len)*bot.speed; bot.y+=(dy/len)*bot.speed;
    bot.x=Math.max(bot.r,Math.min(W-bot.r,bot.x));
    bot.y=Math.max(bot.r+35,Math.min(H-CONTROL_H-bot.r,bot.y));

    for(let i=dots.length-1;i>=0;i--){
      if(dist(bot,dots[i])<bot.r+dots[i].r){
        bot.m+=dots[i].v; bot.r+=dots[i].v*2.1;
        dots.splice(i,1); dots.push(makeDot());
      }
    }
    if(dist(bot,player)<bot.r+player.r*.70){
      if(bot.r>player.r*1.12){endGame('EATEN!',bot.name+' caught you.')}
      else if(player.r>bot.r*1.12){player.m+=bot.m*.12;player.r+=bot.r*.06;Object.assign(bot,makeBot(Math.floor(rand(0,6))))}
    }
  })
}

function loop(now){
  if(!running) return;
  const elapsed=now-startTime;
  if(elapsed>2000){portal.active=true;statusEl.textContent='ESCAPE!'}
  if(elapsed>=roundLength){endGame('LOST','Arena collapsed.');return}

  const maxSpeed=mobile()?2.25:4.05;
  const accel=mobile()?0.24:0.36;
  const friction=mobile()?0.84:0.87;
  const slow=Math.max(.58,1-(player.r-player.baseR)*0.010);

  if(joy.active){
    player.vx+=joy.x*accel;
    player.vy+=joy.y*accel;
  } else if(!mobile() && pointer.active) {
    const dx=pointer.x-player.x,dy=pointer.y-player.y,len=Math.hypot(dx,dy);
    if(len>10){player.vx+=(dx/len)*0.12;player.vy+=(dy/len)*0.12}
  }

  player.vx*=friction; player.vy*=friction;
  player.x+=player.vx*maxSpeed*slow; player.y+=player.vy*maxSpeed*slow;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r+35,Math.min(H-CONTROL_H-player.r,player.y));

  if(Math.abs(player.vx)+Math.abs(player.vy)<0.04&&player.m>1){
    player.m=Math.max(1,player.m-0.006); player.r=Math.max(player.baseR,player.r-0.025); statusEl.textContent='Move!';
  }

  for(let i=dots.length-1;i>=0;i--){
    if(dist(player,dots[i])<player.r+dots[i].r){
      player.m+=dots[i].v; player.r+=dots[i].v*(mobile()?2.5:3.0);
      dots.splice(i,1); dots.push(makeDot());
    }
  }

  if(!window.lastBombSpawn) window.lastBombSpawn=now;
  if(now-window.lastBombSpawn>(mobile()?2300:1800)){
    bombs.push(makeBomb());
    if(bombs.length>(mobile()?10:14)) bombs.shift();
    window.lastBombSpawn=now;
  }
  for(const b of bombs){b.r=bombRadius(b); if(dist(player,b)<player.r+b.r){endGame('BOOM!','Bomb exploded.');return}}

  updateBots(); if(!running)return;

  if(portal.active){
    if(now-portal.lastMove>(mobile()?1900:1500)){portal.x=rand(70,W-70);portal.y=rand(70,H-CONTROL_H-70);portal.lastMove=now}
    if(dist(player,portal)<player.r+portal.r*.70){endGame('SUCCESS','You escaped alive.');return}
  }

  draw(now, elapsed);
  updateAudio(now);
  requestAnimationFrame(loop);
}
function draw(now, elapsed){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.strokeStyle=`rgba(255,0,80,${Math.min(.28,elapsed/roundLength*.28)})`;
  ctx.lineWidth=12+elapsed/900; ctx.strokeRect(0,0,W,H-CONTROL_H); ctx.restore();

  dots.forEach(d=>{d.p+=.08;glow(d.x,d.y,d.r+Math.sin(d.p)*1.1,'#00eaff',16)});
  bombs.forEach(b=>{b.p+=.12;glow(b.x,b.y,b.r+Math.sin(b.p)*1.2,'#ff245d',24)});

  bots.forEach(bot=>{
    glow(bot.x,bot.y,bot.r,bot.color,24);
    ctx.fillStyle='#06111f';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(bot.m.toFixed(1)+'x',bot.x,bot.y+3);
    ctx.fillStyle='rgba(255,255,255,.82)';ctx.font='9px Arial';ctx.fillText(bot.name,bot.x,bot.y-bot.r-6);
  });

  if(portal.active){
    ctx.save();ctx.translate(portal.x,portal.y);ctx.rotate(now/600);
    ctx.shadowBlur=35;ctx.shadowColor='#ffe600';ctx.strokeStyle='#ffe600';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(0,0,portal.r*(1+Math.sin(now/120)*.08),0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.fillStyle='#ffe600';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('ESCAPE',portal.x,portal.y+4);
  }

  glow(player.x,player.y,player.r,player.m>3?'#ffd700':'#8affff',34);
  ctx.fillStyle='#06111f';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(player.m.toFixed(2)+'x',player.x,player.y+4);

  multEl.textContent='x'+player.m.toFixed(2);
}

addEventListener('mousemove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true});

function resetKnob(){joyKnob.style.left='50%';joyKnob.style.top='42%'}
function touchHandler(e){
  const target=e.target;
  if(target && target.classList && target.classList.contains('gameBtn')) return;
  if(!e.touches[0]) return;
  e.preventDefault();
  const t=e.touches[0];

  if(t.clientY>H-CONTROL_H){
    const rect=pad.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height*.42;
    const dx=t.clientX-cx, dy=t.clientY-cy, len=Math.hypot(dx,dy);
    const dead=16, max=64;
    if(len<dead){joy.x=0;joy.y=0;joy.active=false;resetKnob();return}
    const power=Math.min((len-dead)/(max-dead),1);
    const smooth=Math.pow(power,1.6);
    joy.x=(dx/len)*smooth; joy.y=(dy/len)*smooth; joy.active=true;
    const knobDist=Math.min(len,max);
    joyKnob.style.left=(50+(dx/len)*knobDist/rect.width*100)+'%';
    joyKnob.style.top=(42+(dy/len)*knobDist/rect.height*100)+'%';
  }
}
addEventListener('touchstart',touchHandler,{passive:false});
addEventListener('touchmove',touchHandler,{passive:false});
addEventListener('touchend',()=>{joy.x=0;joy.y=0;joy.active=false;resetKnob()},{passive:false});
</script>
</body>
</html>

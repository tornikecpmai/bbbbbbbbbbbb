<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grow Or Escape</title>
<style>
html,body{
margin:0;padding:0;overflow:hidden;background:#050712;
font-family:Arial,sans-serif;color:white;touch-action:none;
}
canvas{
display:block;
background:radial-gradient(circle at center,#13204a 0%,#050712 75%);
}
#ui{
position:fixed;top:12px;left:12px;z-index:10;
font-size:15px;line-height:1.5;
text-shadow:0 0 10px #00eaff;
pointer-events:none;
}
#center{
position:fixed;inset:0;display:flex;
align-items:center;justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.45);
z-index:20;text-align:center;padding:20px;
}
h1{
margin:0 0 10px;
font-size:42px;
text-shadow:0 0 24px #00eaff;
}
button{
margin-top:16px;
padding:15px 28px;
border:0;border-radius:999px;
background:#00eaff;
color:#05111d;
font-size:18px;
font-weight:bold;
box-shadow:0 0 24px #00eaff;
touch-action:manipulation;
}
#hint{
position:fixed;
bottom:160px;
width:100%;
text-align:center;
font-size:12px;
opacity:.7;
pointer-events:none;
}
#pad{
position:fixed;
left:0;right:0;bottom:0;
height:150px;
background:linear-gradient(180deg,rgba(0,234,255,.04),rgba(0,234,255,.18));
border-top:2px solid rgba(0,234,255,.35);
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
text-shadow:0 0 8px #00eaff;
}
</style>
</head>
<body>

<div id="ui">
Multiplier: <span id="mult">x1.00</span><br>
Status: <span id="status">Grow</span>
</div>

<div id="hint">Eat blue multipliers • Avoid bombs • Escape before collapse</div>

<div id="pad">JOYSTICK AREA</div>

<div id="center">
<h1>GROW OR ESCAPE</h1>
<p>Grow fast. Escape alive.</p>
<button id="startBtn">START ROUND</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const multEl=document.getElementById('mult');
const statusEl=document.getElementById('status');
const center=document.getElementById('center');
const startBtn=document.getElementById('startBtn');

let W,H;
let player,dots,bombs,bots,portal;
let startTime,roundLength;
let running=false;

let joy={x:0,y:0,active:false};

const CONTROL_H=150;
const MOBILE=window.innerWidth<900;

function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

function rand(a,b){return Math.random()*(b-a)+a;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function makeDot(){
const v=[.06,.08,.12,.18,.25][Math.floor(Math.random()*5)];
const s=MOBILE?.72:1;
return{
x:rand(20,W-20),
y:rand(40,H-CONTROL_H-30),
r:(7+v*18)*s,
v,
pulse:rand(0,6.28)
};
}

function makeBomb(){
const s=MOBILE?.75:1;
const base=rand(10,16)*s;
return{
x:rand(30,W-30),
y:rand(50,H-CONTROL_H-40),
baseR:base,
r:base,
pulse:rand(0,6.28)
};
}

function makeBot(i){
const colors=['#ff9f1c','#b45cff','#39ff88','#ff4fd8','#ffe600','#42a5ff'];
const names=['VIP','FAST','LUKA','NIKA','HUNTER','GEO'];
return{
x:rand(50,W-50),
y:rand(60,H-CONTROL_H-60),
r:rand(13,19)*(MOBILE?.78:1),
m:rand(1,1.6),
speed:rand(1.2,1.9),
color:colors[i%colors.length],
name:names[i%names.length]
};
}

function bombRadius(b){
const shrink=Math.min((player.r-16)*0.012,.45);
return Math.max((b.baseR)*(1-shrink),MOBILE?5:7);
}

function glow(x,y,r,c,g=22){
ctx.save();
ctx.shadowBlur=g;
ctx.shadowColor=c;
ctx.fillStyle=c;
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function startGame(){

player={
x:W/2,
y:H/2,
r:MOBILE?13:16,
m:1,
vx:0,
vy:0
};

dots=Array.from({length:38},makeDot);
bombs=Array.from({length:7},makeBomb);
bots=Array.from({length:6},(_,i)=>makeBot(i));

portal={
x:rand(80,W-80),
y:rand(80,H-CONTROL_H-80),
r:34,
active:false,
lastMove:0
};

startTime=performance.now();
roundLength=rand(12000,18000);

running=true;
center.style.display='none';

requestAnimationFrame(loop);
}

function endGame(title,msg){
running=false;

center.innerHTML=`
<h1>${title}</h1>
<p>${msg}</p>
<p>x${player.m.toFixed(2)}</p>
<button onclick="location.reload()">PLAY AGAIN</button>
`;

center.style.display='flex';
}

function updateBots(){

bots.forEach(bot=>{

let target=dots[0];
let best=99999;

dots.forEach(d=>{
const dd=dist(bot,d);
if(dd<best){
best=dd;
target=d;
}
});

let tx=target.x;
let ty=target.y;

const pd=dist(bot,player);

if(bot.r>player.r*1.12 && pd<220){
tx=player.x;
ty=player.y;
}
else if(bot.r<player.r*.9 && pd<170){
tx=bot.x+(bot.x-player.x);
ty=bot.y+(bot.y-player.y);
}

const dx=tx-bot.x;
const dy=ty-bot.y;
const len=Math.hypot(dx,dy)||1;

bot.x+=(dx/len)*bot.speed;
bot.y+=(dy/len)*bot.speed;

for(let i=dots.length-1;i>=0;i--){
if(dist(bot,dots[i])<bot.r+dots[i].r){
bot.m+=dots[i].v;
bot.r+=dots[i].v*2.8;
dots.splice(i,1);
dots.push(makeDot());
}
}

if(dist(bot,player)<bot.r+player.r*.75){

if(bot.r>player.r*1.08){
endGame('EATEN!',bot.name+' caught you.');
}

else if(player.r>bot.r*1.08){
player.m+=bot.m*.15;
player.r+=bot.r*.08;
Object.assign(bot,makeBot(Math.floor(rand(0,6))));
}
}

});

}

function loop(now){

if(!running)return;

const elapsed=now-startTime;

if(elapsed>2000){
portal.active=true;
statusEl.textContent='ESCAPE!';
}

if(elapsed>=roundLength){
endGame('LOST','Arena collapsed.');
return;
}

const maxSpeed=4.2;
const slow=Math.max(.55,1-(player.r-16)*0.012);

player.vx+=joy.x*0.55;
player.vy+=joy.y*0.55;

player.vx*=0.88;
player.vy*=0.88;

player.x+=player.vx*maxSpeed*slow;
player.y+=player.vy*maxSpeed*slow;

player.x=Math.max(player.r,Math.min(W-player.r,player.x));
player.y=Math.max(player.r+35,Math.min(H-CONTROL_H-player.r,player.y));

if(Math.abs(player.vx)+Math.abs(player.vy)<0.05 && player.m>1){
player.m=Math.max(1,player.m-0.009);
player.r=Math.max(MOBILE?13:16,player.r-0.04);
statusEl.textContent='Move!';
}

for(let i=dots.length-1;i>=0;i--){
if(dist(player,dots[i])<player.r+dots[i].r){
player.m+=dots[i].v;
player.r+=dots[i].v*3.2;
dots.splice(i,1);
dots.push(makeDot());
}
}

if(!window.lastBombSpawn)window.lastBombSpawn=now;

if(now-window.lastBombSpawn>1800){
bombs.push(makeBomb());
if(bombs.length>14)bombs.shift();
window.lastBombSpawn=now;
}

for(const b of bombs){
b.r=bombRadius(b);

if(dist(player,b)<player.r+b.r){
endGame('BOOM!','Bomb exploded.');
return;
}
}

updateBots();

if(portal.active){

if(now-portal.lastMove>1500){
portal.x=rand(70,W-70);
portal.y=rand(70,H-CONTROL_H-70);
portal.lastMove=now;
}

if(dist(player,portal)<player.r+portal.r*.7){
endGame('SUCCESS','You escaped alive.');
return;
}

}

ctx.clearRect(0,0,W,H);

dots.forEach(d=>{
d.pulse+=.08;
glow(d.x,d.y,d.r+Math.sin(d.pulse)*1.2,'#00eaff',16);
});

bombs.forEach(b=>{
b.pulse+=.12;
glow(b.x,b.y,b.r+Math.sin(b.pulse)*1.4,'#ff245d',24);
});

bots.forEach(bot=>{
glow(bot.x,bot.y,bot.r,bot.color,26);

ctx.fillStyle='#06111f';
ctx.font='bold 10px Arial';
ctx.textAlign='center';
ctx.fillText(bot.m.toFixed(1)+'x',bot.x,bot.y+3);

ctx.fillStyle='rgba(255,255,255,.8)';
ctx.font='9px Arial';
ctx.fillText(bot.name,bot.x,bot.y-bot.r-6);
});

if(portal.active){

ctx.save();
ctx.translate(portal.x,portal.y);
ctx.rotate(now/600);

ctx.shadowBlur=35;
ctx.shadowColor='#ffe600';
ctx.strokeStyle='#ffe600';
ctx.lineWidth=6;

ctx.beginPath();
ctx.arc(0,0,portal.r*(1+Math.sin(now/120)*.08),0,Math.PI*2);
ctx.stroke();

ctx.restore();

}

const playerColor=player.m>3?'#ffd700':'#8affff';

glow(player.x,player.y,player.r,playerColor,34);

ctx.fillStyle='#06111f';
ctx.font='bold 13px Arial';
ctx.textAlign='center';
ctx.fillText(player.m.toFixed(2)+'x',player.x,player.y+4);

multEl.textContent='x'+player.m.toFixed(2);

requestAnimationFrame(loop);

}

function touchHandler(e){

const target=e.target;

if(target && target.id==='startBtn')return;

if(e.touches[0]){

e.preventDefault();

const t=e.touches[0];

if(t.clientY>H-CONTROL_H){

const cx=W/2;
const cy=H-CONTROL_H/2;

const dx=t.clientX-cx;
const dy=t.clientY-cy;

const len=Math.hypot(dx,dy);

const dead=18;
const max=CONTROL_H*.42;

if(len<dead){
joy.x=0;
joy.y=0;
joy.active=false;
return;
}

const power=Math.min((len-dead)/(max-dead),1);
const smooth=power*power;

joy.x=(dx/len)*smooth;
joy.y=(dy/len)*smooth;
joy.active=true;

}

}

}

window.addEventListener('touchstart',touchHandler,{passive:false});
window.addEventListener('touchmove',touchHandler,{passive:false});

window.addEventListener('touchend',()=>{
joy.x=0;
joy.y=0;
joy.active=false;
},{passive:false});

startBtn.addEventListener('click',startGame);

startBtn.addEventListener('touchend',e=>{
e.preventDefault();
startGame();
},{passive:false});

</script>
</body>
</html>
